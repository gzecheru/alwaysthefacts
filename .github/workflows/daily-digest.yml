name: Generate Daily Global News Digest

on:
  schedule:
    # Runs daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # If your script needs extra packages not in package.json,
      # add them to package.json instead of installing here.
      # (But if you really want to install ad-hoc, you can.)
      # - name: Install extra script deps
      #   run: npm install anthropic feedparser xml2js

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-digest.js

      - name: Commit and push digest (if changed)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add src/content/digests/
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Daily digest: $(date +'%Y-%m-%d')" && git push)

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
